Logging:
    # Defines log level. Usual values are INFO and DEBUG
    log_level: INFO
    # If True (default), every log entry written to a log file is also mirrored to stdout
    mirror_to_stdout: True

# Log file retention, applied by mc_copy_number_log_cleanup.py. Meant to run as its own
# periodically scheduled job (e.g. weekly), separate from the pipeline entry points.
LogCleanup:
    # Log files in Location/logs last modified more than this many days ago are deleted.
    retention_days: 21

# Database connection for aliquot validation
Database:
    connection:
        mdb_conn_str: "Driver={!driver!};Server={!server!};Database={!db_name!};UID={!db_user_name!};PWD={!db_user_pwd!};TrustServerCertificate=yes;"
        db_plh_driver: "{!driver!}"
        db_plh_server: "{!server!}"
        db_plh_db_name: "{!db_name!}"
        db_plh_user_name: "{!db_user_name!}"
        db_plh_user_pwd: "{!db_user_pwd!}"
        env_db_driver: MC_DB_DRIVER      # name of the environment variable holding the value
        env_db_server: MC_DB_SERVER
        env_db_name: MC_DB_NAME
        env_db_user_name: MC_DB_USER_NAME
        env_db_user_pwd: MC_DB_USER_PWD

# Email settings for status reports. Sender/recipient addresses live in .env
# (MC_EMAIL_FROM, MC_EMAIL_TO, MC_EMAIL_ADDITIONAL_TO) rather than here, since this file is
# checked into git and email addresses are environment-specific/personal data.
Email:
    send_emails: True
    # Common prefix used in every status email subject line.
    # Change here to rename the application across all email subjects.
    email_subject_prefix: 'Mitochondrial Copy Number Processing'
    # When True, status emails are also sent to the address(es) in MC_EMAIL_ADDITIONAL_TO (.env),
    # in addition to MC_EMAIL_TO. Defaults to False when unset.
    include_additional_emails: True

# Canonical output column names for the standardized alignment CSV.
# Provider configs reference fields by their schema key (the left-hand side).
# To rename an output column, change only the right-hand value here —
# no provider config update is needed.
Alligned_file_schema:
  fields:
    aliquot_id: aliquot_id
    mtdna_mean: mtDNA_copy_num_mean
    mtdna_se: mtDNA_copy_num_SE

# Settings applied when writing CSV output files (raw_data alignment output and processed_data
# counts output).
Csv_output:
    # When True (default), a CSV file is saved with a UTF-8 BOM if it contains non-ASCII
    # characters (e.g. an accented aliquot ID), so the value displays correctly when the file
    # is opened directly in Excel. Files with only plain ASCII content are unaffected either way.
    # Set to False to always write plain UTF-8 (no BOM) — e.g. if downstream tooling (such as
    # base R's read.csv() without fileEncoding='UTF-8-BOM') is not BOM-aware.
    enable_utf8_bom: True

Alignment:
    # Sub-directory under mitCopyN_studies_dir (location config) that holds provider run folders
    run_folders_dir: runFolders
    # Sub-directory under mitCopyN_studies_dir where converted files are written
    raw_data_dir: raw_data
    # Sub-folder name inside each provider's run folder (runFolders/<Provider>/) containing files ready for processing
    ready_subfolder: ready
    # Sub-folder name inside each provider's run folder used to atomically claim a file before processing (prevents double-processing)
    processing_temp_subfolder: temp_processing
    # Sub-folder name inside each provider's run folder where source files are moved after successful processing
    processed_subfolder: processed
    # Sub-folder name inside each provider's run folder where source files are moved after a processing error (for manual intervention)
    reprocess_subfolder: work
    # Path (relative to project root) to the directory holding per-provider config sub-folders
    providers_config_dir: configs/providers
    # When True, each processed file's aliquot IDs are validated against the metadata database
    # after alignment completes. Requires Database/connection settings and DB credentials in .env.
    validate_aliquots_against_db: True
    # When True (and validate_aliquots_against_db is True), the Counts step runs automatically
    # after a successful alignment + DB validation (all aliquots found, single program code).
    # Has no effect when running mc_copy_number_alignment.py standalone.
    allow_automated_counts_processing: True
    # When False (default), all aliquots in a file must belong to exactly one program for processing
    # to proceed. When True, aliquots spanning multiple programs are accepted and Counts will produce
    # a separate output file per program, each placed in its own program-named sub-folder.
    allow_multiple_programs: True

Requests:
    # Optional Excel sheet name to read from request files. If omitted or blank, the first
    # available sheet is used. If the configured sheet is not found, processing falls back to
    # the first sheet and reports a warning.
    request_sheet_name: ''
    # Sub-folder names under Location/requests_dir used for the request file lifecycle.
    ready_subfolder: ready
    processing_temp_subfolder: processing_temp
    processed_subfolder: processed
    reprocess_subfolder: work

Counts:
    # Sub-directory under mitCopyN_studies_dir where transposed count table files are written
    processed_data_dir: processed_data
    # Number of parent folder levels to preserve from the input CSV path when building the
    # output path under processed_data_dir.
    # depth=1 (default): <timestamp_stem>/file.csv  →  processed_data/<timestamp_stem>/file.csv
    # depth=2:           raw_data/<timestamp_stem>/file.csv  →  processed_data/raw_data/<timestamp_stem>/file.csv
    output_path_depth: 1

